name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version tag: ${RELEASE_TAG}" >&2
            exit 2
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true

      - name: Configure OpenSSL on Linux
        if: runner.os == 'Linux'
        env:
          OPENSSL_VERSION: "3.6.3"
        run: |
          set -euo pipefail
          archive="openssl-${OPENSSL_VERSION}.tar.gz"
          curl -fL "https://www.openssl.org/source/${archive}" -o "${archive}"
          curl -fsSL "https://www.openssl.org/source/${archive}.sha256" -o checksum
          expected="$(awk '{print $1}' checksum)"
          printf '%s  %s\n' "${expected}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure shared --prefix="${RUNNER_TEMP}/openssl" --openssldir="${RUNNER_TEMP}/openssl/ssl"
          make -j2
          make install_sw
          mkdir -p "${RUNNER_TEMP}/openssl/ssl"
          cp apps/openssl.cnf "${RUNNER_TEMP}/openssl/ssl/openssl.cnf"
          echo "${RUNNER_TEMP}/openssl/bin" >> "${GITHUB_PATH}"
          {
            echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/openssl/lib64/pkgconfig:${RUNNER_TEMP}/openssl/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/openssl/lib64:${RUNNER_TEMP}/openssl/lib"
          } >> "${GITHUB_ENV}"

      - name: Configure OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 pkg-config
          prefix="$(brew --prefix openssl@3)"
          echo "${prefix}/bin" >> "${GITHUB_PATH}"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> "${GITHUB_ENV}"

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          make check
          make release VERSION="${version}"
          ./bin/cw doctor

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify and consolidate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          for checksum in *.tar.gz.sha256; do
            sha256sum -c "${checksum}"
          done
          sha256sum *.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "CryptoWrapper ${RELEASE_TAG}"
          fi
